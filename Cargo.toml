[package]
name = "reticle"
version = "0.6.0"
description = "Lightweight crosshair overlay for Windows"
license-file = "LICENSE"
repository = "https://github.com/7danee/reticle"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "clipboard"] }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
resvg = { version = "0.50.0", default-features = false }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
skrifa = { version = "0.44", default-features = false, features = ["std"] }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd", "png-format"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_UI_Input", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.34"
